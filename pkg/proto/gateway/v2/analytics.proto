syntax = "proto3";

package pkg.proto.gateway.v2;

option go_package = "github.com/myDevicesIoT/protos/pkg/proto/gateway/v2;gateway";

message TimeRange {
  string start_time = 1; // RFC3339 or relative like "now-6h"
  string end_time = 2;   // RFC3339 or "now"
  string timezone = 3;   // e.g. "UTC", "America/Los_Angeles"
}

message Filter {
  string device_id = 1;               // optional
  string device_type_id = 2;          // optional
  string user_id = 3;                 // optional
  string application_id = 4;          // optional
  repeated string hardware_ids = 5;   // optional (gateway hardware_id)
}

message BucketSpec { string fixed_interval = 1; } // e.g. "5m"

message SeriesPoint { string ts = 1; double value = 2; }
message BucketSeries { string key = 1; repeated SeriesPoint points = 2; }

message GetPingHistogramRequest {
  Filter filter = 1;
  TimeRange range = 2;
  BucketSpec bucket = 3;
  int32 max_buckets = 4; // default 1440
  int32 top_n = 5;       // split by top gateways
}
message GetPingHistogramResponse { repeated BucketSeries series = 1; }

message HistogramBucket { double key = 1; int64 count = 2; }

message GetGatewayStatsRequest { Filter filter = 1; TimeRange range = 2; int32 top_n = 3; }
message GatewayStats {
  string hardware_id = 1;
  uint64 unique_devices = 2;
  uint64 rx_packets_received = 3;
  uint64 rx_packets_received_ok = 4;
  double success_ratio = 5; // ok/received
}
message GetGatewayStatsResponse { repeated GatewayStats gateways = 1; }

// Pagination carries an opaque page cursor for composite-paginated RPCs.
message Pagination {
  int32 page_size = 1;   // default 100, max 1000
  string page_token = 2; // opaque; carries the composite after_key
}

message GetSilentGatewaysRequest {
  TimeRange baseline = 1;           // required, e.g. now-14d .. now-24h
  TimeRange observe = 2;            // required, e.g. now-24h .. now
  Filter filter = 3;                // optional
  Pagination page = 4;              // optional
  int32 min_baseline_pings = 5;     // optional, default 1
}

message SilentGateway {
  string hardware_id = 1;
  string application_id = 2;
  string device_type_id = 3;
  string dps_client_version = 4;
  string last_seen = 5;             // RFC3339, max(@timestamp) across baseline
  int32 baseline_pings = 6;
  int32 baseline_unique_devices = 7;
}

message GetSilentGatewaysResponse {
  repeated SilentGateway gateways = 1;
  int32 total_baseline_active = 2;  // distinct hardware_id in baseline, after filter
  int32 total_silent = 3;           // distinct hardware_id silent in observe
  string next_page_token = 4;
}

message GetGatewayBreakdownRequest {
  TimeRange baseline = 1;           // required
  TimeRange observe = 2;            // required
  Filter filter = 3;                // optional
  string group_by = 4;              // required
  int32 top_n = 5;                  // optional, default 20, max 100
}

message BreakdownBucket {
  string key = 1;
  int32 baseline_active = 2;        // distinct hardware_id in baseline
  int32 current_active = 3;         // distinct hardware_id in observe
  int32 silent = 4;                 // baseline_active - current_active, floored at 0
  double silent_ratio = 5;          // silent / baseline_active, 0 when baseline_active is 0
}

message GetGatewayBreakdownResponse {
  repeated BreakdownBucket buckets = 1;
  int32 total_baseline_active = 2;
  int32 total_current_active = 3;
}

service GatewayAnalytics {
  rpc GetPingHistogram(GetPingHistogramRequest) returns (GetPingHistogramResponse);
  rpc GetGatewayStats(GetGatewayStatsRequest) returns (GetGatewayStatsResponse);
  rpc GetSilentGateways(GetSilentGatewaysRequest) returns (GetSilentGatewaysResponse);
  rpc GetGatewayBreakdown(GetGatewayBreakdownRequest) returns (GetGatewayBreakdownResponse);
}

